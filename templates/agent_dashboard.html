<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoraLink Agent</title><link rel="stylesheet" href="/static/agent.css?v=6"></head><body>
<div id="login" class="center"><div class="card"><h2>KoraLink Support</h2><input id="email" type="email" autocomplete="username" placeholder="Work email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button onclick="login()">Sign in</button><p id="err" role="alert"></p></div></div>
<div id="app" class="hidden"><header><b>KoraLink Support</b><span id="name"></span><a id="kbLink" class="hidden" href="/knowledge">Knowledge base</a><button onclick="logout()">Logout</button></header><main><aside><p id="notice" role="status"></p><h3>Waiting <span id="qc">0</span></h3><div id="queue"></div><h3>My Active <span id="ac">0</span></h3><div id="active"></div></aside><section><div id="empty" class="center">Select a conversation</div><div id="chat" class="hidden"><div class="top"><b id="status"></b><span id="cid"></span><button id="claim" onclick="claim()">Claim</button><button id="close" onclick="closeChat()">Close</button></div><div id="messages"></div><div id="composer"><input id="msg" maxlength="2000" placeholder="Message..."><input id="attachment" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden onchange="sendAttachment(this.files[0])"><button type="button" onclick="document.getElementById('attachment').click()">Attach image</button><button onclick="send()">Send</button></div></div></section></main></div><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script src="/static/agent.js?v=4"></script></body></html>
