<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoraLink Agent</title><link rel="stylesheet" href="/static/agent.css"></head><body>
<div id="login" class="center"><div class="card"><h2>KoraLink Support</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="err"></p></div></div>
<div id="app" class="hidden"><header><b>KoraLink Support</b><span id="name"></span><button onclick="logout()">Logout</button></header><main><aside><h3>Waiting <span id="qc">0</span></h3><div id="queue"></div><h3>My Active <span id="ac">0</span></h3><div id="active"></div></aside><section><div id="empty" class="center">Select a conversation</div><div id="chat" class="hidden"><div class="top"><b id="status"></b><span id="cid"></span><button id="claim" onclick="claim()">Claim</button><button id="close" onclick="closeChat()">Close</button></div><div id="messages"></div><div id="composer"><input id="msg" maxlength="2000" placeholder="Message..."><button onclick="send()">Send</button></div></div></section></main></div><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script src="/static/agent.js"></script></body></html>
