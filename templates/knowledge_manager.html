<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KoraLink Knowledge Base</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182235;font:15px Segoe UI,Arial,sans-serif}header{height:68px;background:#fff;border-bottom:1px solid #dce3ed;display:flex;align-items:center;justify-content:space-between;padding:0 24px}header b{font-size:20px}button{border:0;border-radius:8px;padding:10px 15px;background:#0a367c;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#e8edf5;color:#253348}button.danger{background:#b42332}.layout{display:grid;grid-template-columns:minmax(300px,38%) 1fr;height:calc(100vh - 68px)}aside,main{padding:20px;overflow:auto}aside{background:#fff;border-right:1px solid #dce3ed}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input{flex:1}.field,input,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:11px;background:white;width:100%}.item{padding:13px;border:1px solid #e0e6ee;border-radius:9px;margin:9px 0;cursor:pointer;background:#fff}.item:hover,.item.selected{border-color:#3763db;background:#f5f7ff}.item small{display:block;color:#64748b;margin-top:5px}.editor{max-width:850px;background:#fff;border:1px solid #e0e6ee;border-radius:12px;padding:22px}.editor label{display:block;font-weight:600;margin:14px 0 6px}.editor textarea{min-height:170px;resize:vertical}.editor textarea#keywords{min-height:90px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.meta{display:flex;gap:14px;flex-wrap:wrap}.meta label{display:flex;align-items:center;gap:7px}.meta input{width:auto}.status{min-height:24px;color:#475569}.pager{display:flex;align-items:center;justify-content:space-between;margin:16px 0}.muted{color:#64748b}.hidden{display:none!important}.image-row{border:1px solid #dce3ed;border-radius:9px;padding:12px;margin:10px 0;background:#f9fbfe}.image-row-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.image-row label{margin-top:8px!important}.image-row img{display:block;max-width:160px;max-height:110px;object-fit:contain;margin-top:8px;border-radius:6px}.image-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:720px){.layout{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid #dce3ed}main{min-height:65vh}header{padding:0 14px}.toolbar{flex-wrap:wrap}.image-fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><b>KoraLink Knowledge Base</b><div><button class="secondary" onclick="location.href='/agent'">Support dashboard</button> <button onclick="logout()">Logout</button></div></header>
<div class="layout">
  <aside>
    <input id="search" placeholder="Search questions, answers, keywords…" autocomplete="off">
    <div class="toolbar"><button onclick="newEntry()">+ New entry</button><button class="secondary" onclick="downloadBackup()">Download backup</button></div>
    <div id="results" class="muted">Loading knowledge…</div>
    <div class="pager"><button class="secondary" id="prev" onclick="changePage(-1)">Previous</button><span id="pageInfo" class="muted"></span><button class="secondary" id="next" onclick="changePage(1)">Next</button></div>
  </aside>
  <main>
    <div class="editor">
      <h2 id="formTitle">Select an entry to edit</h2><p class="status" id="status" role="status"></p>
      <form id="form" class="hidden">
        <label for="question">Question — English</label><input id="question" maxlength="500" required>
        <label for="answer">Answer — English</label><textarea id="answer" maxlength="10000" required></textarea>
        <label for="keywords">English search keywords <span class="muted">(one per line)</span></label><textarea id="keywords"></textarea>
        <label>Answer images and URL links</label><p class="muted">Edit English alt text and captions, and update image URLs. These images appear with the chatbot answer.</p><div id="imageRows"></div><button type="button" class="secondary" onclick="addImage()">+ Add image</button>
        <div class="meta"><div><label for="category">Category</label><input id="category" maxlength="100"></div><div><label for="language">Language</label><input id="language" maxlength="100"></div></div>
        <div class="meta"><label><input id="active" type="checkbox" checked> Active for chatbot</label></div>
        <div class="actions"><button type="submit">Save to MongoDB</button><button type="button" class="danger" id="delete" onclick="removeEntry()">Delete</button></div>
      </form>
    </div>
  </main>
</div>
<script>
const token=localStorage.getItem('kora_agent_token');let page=1,pages=1,total=0,current=null,items=[],imageItems=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
async function api(url,options={}){const res=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Agent-Token':token,...options.headers}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||`Request failed (${res.status})`);return data}
function logout(){localStorage.removeItem('kora_agent_token');location.href='/agent'}
async function load(){if(!token){$('status').textContent='Log in as an admin from the support dashboard to manage knowledge.';return}try{const p=new URLSearchParams({q:$('search').value,page,limit:20});const d=await api('/api/admin/knowledge?'+p);items=d.items;total=d.total;pages=d.pages;$('pageInfo').textContent=`Page ${page} of ${pages} · ${total} entries`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;drawList()}catch(e){$('results').textContent=e.message;$('status').textContent=e.message}}
function drawList(){$('results').innerHTML=items.length?items.map((x,i)=>`<div class="item ${current?.id===x.id?'selected':''}" onclick="selectEntry(${i})"><b>${esc(x.question)}</b><small>${esc((x.answer||'').slice(0,110))}${(x.answer||'').length>110?'…':''} · ${x.active===false?'Inactive':'Active'}</small></div>`).join(''):'No matching entries. Try another search or add an entry.'}
function renderImages(images){imageItems=(images||[]).map(image=>typeof image==='string'?{type:'screenshot',src:image,alt:'',caption:''}:{...image,alt:image.alt_en||image.alt||'',caption:image.caption_en||image.caption||''});const root=$('imageRows');root.replaceChildren();imageItems.forEach((image,index)=>{const row=document.createElement('div');row.className='image-row';const head=document.createElement('div');head.className='image-row-head';const title=document.createElement('b');title.textContent=`Image ${index+1}`;const remove=document.createElement('button');remove.type='button';remove.className='danger';remove.textContent='Remove';remove.onclick=()=>{imageItems.splice(index,1);renderImages(imageItems)};head.append(title,remove);row.appendChild(head);const fields=document.createElement('div');fields.className='image-fields';[['Image URL','src','https://…'],['Alt text — English','alt','Describe the image'],['Caption — English','caption','Image caption']].forEach(([label,key,placeholder])=>{const wrap=document.createElement('div');const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.placeholder=placeholder;input.value=image[key]||'';input.addEventListener('input',()=>{imageItems[index][key]=input.value;const preview=row.querySelector('img');if(key==='src'&&preview)preview.src=input.value});wrap.append(l,input);fields.appendChild(wrap)});row.appendChild(fields);if(image.src){const preview=document.createElement('img');preview.alt=image.alt||'Image preview';preview.src=image.src;preview.onerror=()=>{preview.classList.add('hidden')};row.appendChild(preview)}root.appendChild(row)})}
function addImage(){imageItems.push({type:'screenshot',src:'',alt:'',caption:''});renderImages(imageItems)}
function selectEntry(i){current=items[i];$('formTitle').textContent='Edit knowledge entry';$('form').classList.remove('hidden');$('delete').classList.remove('hidden');$('question').value=current.question||'';$('answer').value=current.answer||'';$('keywords').value=(current.keywords||[]).join('\n');$('category').value=current.category||'';$('language').value=current.language||'';$('active').checked=current.active!==false;renderImages(current.images|| (current.image?(Array.isArray(current.image)?current.image:[current.image]):[]));$('status').textContent='English changes save directly to MongoDB.';drawList()}
function newEntry(){$('form').reset();current=null;renderImages([]);$('formTitle').textContent='Add knowledge entry';$('form').classList.remove('hidden');$('delete').classList.add('hidden');$('active').checked=true;$('status').textContent='This entry will be saved directly to MongoDB.';$('question').focus()}
function changePage(delta){page=Math.min(pages,Math.max(1,page+delta));load()}
let timer; $('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},250)});
$('form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='Saving…';const body={question:$('question').value.trim(),answer:$('answer').value.trim(),keywords:$('keywords').value.split('\n').map(x=>x.trim()).filter(Boolean),images:imageItems.filter(x=>x.src&&x.src.trim()).map(x=>({...x,src:x.src.trim()})),category:$('category').value.trim(),language:$('language').value.trim(),active:$('active').checked};try{const d=await api(current?'/api/admin/knowledge/'+encodeURIComponent(current.id):'/api/admin/knowledge',{method:current?'PUT':'POST',body:JSON.stringify(body)});current=d.item;renderImages(current.images||[]);page=1;await load();$('status').textContent=d.chatbot_refreshed?'Saved. The running chatbot knowledge has been refreshed.':'Saved to MongoDB, but the chatbot index could not refresh. Check Flask logs; restart may be needed.'}catch(err){$('status').textContent=err.message}});
async function removeEntry(){if(!current||!confirm(`Permanently delete “${current.question}”?`))return;try{const d=await api('/api/admin/knowledge/'+encodeURIComponent(current.id),{method:'DELETE'});current=null;$('form').classList.add('hidden');$('formTitle').textContent='Entry deleted';$('status').textContent=d.chatbot_refreshed?'Deleted from MongoDB and removed from chatbot knowledge.':'Deleted from MongoDB; chatbot index did not refresh. Check Flask logs.';await load()}catch(e){$('status').textContent=e.message}}
async function downloadBackup(){try{const d=await api('/api/admin/knowledge/export');const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='koralink_knowledge_backup.json';a.click();URL.revokeObjectURL(url)}catch(e){$('status').textContent=e.message}}
load();
</script>
</body></html>
